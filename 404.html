:root{
  --bg:#F7F2EC; --card:#FFFFFF; --ink:#241E19; --muted:#6B5C51; --faint:#7C6959;
  --line:#E8DED1; --sand:#F6EDE2; --terra:#95562A; --terra-d:#78431F; --terra-l:#E3C9AC;
  --grad:linear-gradient(152deg,#C08B57 0%,#95562A 48%,#6C3C1B 100%);
  --sh:0 2px 8px rgba(60,44,30,.06), 0 24px 60px -28px rgba(60,44,30,.3);
  --font:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Manrope","Inter",sans-serif;
}
html[data-theme="dark"]{
  --bg:#15110E; --card:#231D18; --ink:#F1E9E1; --muted:#B5A396; --faint:#9C8A7B;
  --line:#352B24; --sand:#1F1915; --terra:#DCA979; --terra-d:#C4915F; --terra-l:#3A2B1E;
  --sh:0 2px 8px rgba(0,0,0,.4), 0 28px 70px -30px rgba(0,0,0,.7);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110E; --card:#231D18; --ink:#F1E9E1; --muted:#B5A396; --faint:#9C8A7B;
  --line:#352B24; --sand:#1F1915; --terra:#DCA979; --terra-d:#C4915F; --terra-l:#3A2B1E;
  --sh:0 2px 8px rgba(0,0,0,.4), 0 28px 70px -30px rgba(0,0,0,.7);
}}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--ink);line-height:1.55;min-height:100svh;
  display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(42% 32% at 84% 6%, rgba(214,163,106,.22), transparent 70%),
    radial-gradient(38% 30% at 8% 94%, rgba(226,190,150,.16), transparent 72%),
    var(--bg)}
.box{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:40px 36px 34px;box-shadow:var(--sh);text-align:center}
.mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:26px}
.mark img{display:block;width:30px;height:auto}
.mark b{font-family:var(--head);font-size:15px;font-weight:800;letter-spacing:-.02em}

.art{width:132px;height:132px;margin:0 auto 22px;position:relative}
.art svg{width:100%;height:100%;display:block}
.num{font-family:var(--head);font-size:clamp(56px,16vw,84px);font-weight:800;
  letter-spacing:-.05em;line-height:1;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
h1{font-family:var(--head);font-size:clamp(20px,5vw,25px);font-weight:800;
  letter-spacing:-.03em;margin-bottom:10px}
p{color:var(--muted);font-size:15px;max-width:40ch;margin:0 auto 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;
  padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;
  cursor:pointer;transition:transform .18s,background .18s,border-color .18s,color .18s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--terra);color:#fff}
html[data-theme="dark"] .btn-p{color:#2A1A0C}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-p{color:#2A1A0C}}
.btn-p:hover{background:var(--terra-d)}
.btn-o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-o:hover{border-color:var(--terra);color:var(--terra)}
.foot{margin-top:24px;font-size:13px;color:var(--faint)}
.foot a{color:var(--terra);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}
@media(max-width:420px){.box{padding:32px 22px 28px}.btn{width:100%}}
</style>
